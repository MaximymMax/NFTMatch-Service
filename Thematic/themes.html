<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEMES COLLECTION</title>

    <link rel="stylesheet" href="./themes.css">
    <link rel="stylesheet" href="./themes-title.css">
    <link rel="stylesheet" href="../Monohrome/themes-modal.css">
    <link rel="stylesheet" href="../shared-admin-nav.css?v=8">
    <script src="../config.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="../i18n.js"></script>
    <script src="../auth.js"></script>
    <script src="../auth-badge.js"></script>
</head>

<body>

    <header class="safe-area-gradient"></header>

    <!-- putya: "теперь кнопки вверх уехали, а не на блоке" — на ColorWheel/color-wheel.html
         .cw-page-header (иконки/RU-EN/бейдж) стоит СНАРУЖИ main-container, а вот .cw-tabs — ВНУТРИ
         неё, первым элементом на самой карточке. Раньше весь #cw-admin-nav (шапка+вкладки вместе)
         был вынесен наружу целиком — из-за этого вкладки зависли на голом фоне отдельно от карточки
         вместо того, чтобы быть на ней. Разносим по разным контейнерам, как на колесе: шапка — сюда,
         к safe-area-gradient; вкладки — внутрь main-container (см. ниже). Видимость обоих
         синхронизирует shared-admin-nav.js (один и тот же IP-гейт снимает cw-admin-nav-hidden сразу
         с обоих). -->
    <div id="cw-admin-nav" class="cw-admin-nav-hidden">
        <div class="cw-page-header">
            <div class="cw-header-group">
                <a href="https://t.me/NFTStyler" target="_blank" class="cw-header-link cw-header-link-tg" title="Наш Telegram-канал">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.94 4.11a1.5 1.5 0 00-1.6-.2L3.4 10.8a1.4 1.4 0 00.06 2.6l4.42 1.54 1.7 5.36a1.4 1.4 0 002.31.6l2.47-2.31 4.3 3.16a1.4 1.4 0 002.2-.86l3.06-14.6a1.5 1.5 0 00-.98-1.68zM9.7 14.5l-.3 3.4-1.4-4.4 9.9-6.2-8.2 7.2z"/></svg>
                </a>
            </div>
            <div class="cw-header-group">
                <a href="../API_info/api.html" class="cw-header-link cw-header-link-api" title="API">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
    <script src="../shared-admin-nav.js?v=7"></script>

    <main>
        <div class="main-container">

            <div id="cw-admin-tabs" class="cw-admin-nav-hidden">
                <div class="cw-tabs">
                    <a href="../Monohrome/background-finder.html" class="cw-tab">
                        <img src="https://cdn.changes.tg/gifts/models/Spring%20Basket/png/Knitty%20Kitty.png" alt="">
                        <span>Монохромы</span>
                    </a>
                    <a href="../Thematic/themes.html" class="cw-tab active">
                        <img src="https://cdn.changes.tg/gifts/models/Restless%20Jar/png/Kittens.png" alt="">
                        <span>Тематики</span>
                    </a>
                    <a href="../ColorWheel/color-wheel.html" class="cw-tab">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 11.5 12 4l9 7.5M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>
                        <span>Главная</span>
                    </a>
                    <a href="../ColorWheel/color-wheel.html#search-similar" class="cw-tab">
                        <img src="https://cdn.changes.tg/gifts/models/Snake%20Box/png/Seashore.png" alt="">
                        <span>Похожие</span>
                    </a>
                    <a href="../ColorWheel/color-wheel.html#search" class="cw-tab">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7" stroke-linecap="round"/><path stroke-linecap="round" d="M21 21l-4.3-4.3"/></svg>
                        <span>Поиск по цвету</span>
                    </a>
                </div>
            </div>

            <!-- putya: "займись тематиками, добавь возможность ставить те же флажки, что по
                 визуалу, логике, названию" — тот же ModelThemeEvidence (Visual/Logical/Name),
                 что и в приватном инструменте разметки (mono-cube-live.html), но встроен в саму
                 продакшен-страницу отдельным режимом. Видим только админу (тот же IP-гейт, что и
                 у #cw-admin-tabs выше — shared-admin-nav.js снимает cw-admin-nav-hidden с обоих). -->
            <div class="mode-switcher-container cw-admin-nav-hidden" id="tf-mode-switcher-container">
                <div class="mode-switcher mode-switcher-2" id="tf-mode-switcher" data-active-mode="browse">
                    <button type="button" class="mode-tab active" data-tfmode="browse">Темы</button>
                    <button type="button" class="mode-tab" data-tfmode="flags">Разметка</button>
                </div>
            </div>

            <div id="tf-browse-mode">
            <div class="toolbar-section">
                <div class="toolbar-group">
                    <label class="control-label" data-i18n="sort_method">Способ сортировки</label>
                    <div class="sort-row" style="position: relative;">

                        <div class="custom-dropdown-container" id="sort-dropdown-container">
                            <div class="dropdown-header" id="sort-dropdown-header">
                                <span id="sort-selected-value" data-i18n="sort_list">Списком</span>
                                <div class="arrow"></div>
                            </div>
                            <div class="dropdown-list hidden" id="sort-dropdown-list">
                                <div class="list-option" data-value="v2themes" data-i18n="sort_list">Списком</div>
                                <div class="list-option" data-value="v2tree" data-i18n="sort_tree">Деревом</div>
                            </div>
                        </div>

                        <button id="sort-direction-btn" class="direction-btn" title="Изменить направление" data-i18n-title="title_change_dir">
                            <svg id="dir-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M3 4.5h14.25M3 9h9.75M3 13.5h9.75m4.5-4.5v12m0 0l-3.75-3.75M17.25 21L21 17.25" />
                            </svg>
                        </button>

                        <button id="main-filter-btn" class="direction-btn" title="Фильтры" data-i18n-title="filters">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z" />
                            </svg>
                        </button>

                        <div id="main-filter-popup" class="filter-popup-panel hidden">
                            <div class="fp-section" id="fp-v2-sort-section">
                                <label class="fp-label" data-i18n="display_mode">Режим отображения:</label>
                                <div class="v2-segmented-control">
                                    <button class="v2-seg-btn active" data-sort="count" data-i18n="sort_count">Кол-во</button>
                                    <button class="v2-seg-btn" data-sort="price" data-i18n="filter_sort_price">Цена</button>
                                    <button class="v2-seg-btn" data-sort="name" data-i18n="sort_name">Имя</button>
                                    <button class="v2-seg-btn" data-sort="bg" data-i18n="filter_bg">Фон</button>
                                </div>
                            </div>

                            <div class="fp-row fp-hidden" id="fp-price-row">
                                <div class="fp-col">
                                    <label class="fp-label" data-i18n="price_limit">Ограничение цены (TON):</label>
                                    <input type="number" id="fp-max-price" class="fp-input" placeholder="До скольки?" data-i18n-placeholder="price_limit_placeholder">
                                </div>
                            </div>

                            <div class="fp-row fp-hidden" id="fp-bg-row">
                                <div class="fp-col">
                                    <label class="fp-label" data-i18n="min_compat">Мин. совпадение:</label>
                                    <div class="custom-dropdown-container" id="percent-dropdown-container">
                                        <div class="dropdown-header" id="percent-dropdown-header">
                                            <span id="percent-selected-value">От 80%</span>
                                            <div class="arrow"></div>
                                        </div>
                                        <div class="dropdown-list hidden" id="percent-dropdown-list">
                                            <div class="list-option" data-value="95">От 95%</div>
                                            <div class="list-option" data-value="90">От 90%</div>
                                            <div class="list-option" data-value="80">От 80%</div>
                                            <div class="list-option" data-value="70">От 70%</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="fp-section fp-hidden" id="fp-color-section" style="margin-bottom: 16px; margin-top: 10px;">
                                <label class="fp-label" data-i18n="bg_color">Цвет фона:</label>
                                <div class="custom-dropdown-container" id="color-input-container">
                                    <div class="dropdown-header with-search" id="color-dropdown-header">
                                        <span class="selected-value-placeholder" id="color-selected-value" data-i18n="placeholder_select_color">Выберите цвет...</span>
                                        <input type="text" class="dropdown-search" id="color-search-input" placeholder="Поиск цвета..." autocomplete="off" data-i18n-placeholder="placeholder_search_color">
                                        <div class="arrow"></div>
                                    </div>
                                    <div class="dropdown-list hidden" id="color-dropdown-list">
                                        <div id="color-list-options"></div>
                                    </div>
                                </div>
                            </div>

                            <button id="fp-apply-btn" class="fp-apply-btn" data-i18n="btn_apply">Применить</button>
                        </div>
                    </div>
                </div>

                <div class="toolbar-group bottom-group" style="margin-top: -10px;">
                    <div id="text-input-container" class="custom-dropdown-container">
                        <label class="control-label" for="theme-text-search" data-i18n="search_title">Поиск</label>
                        <div class="input-wrapper">
                            <div class="search-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                            </div>
                            <input type="text" id="theme-text-search" class="theme-search-input" placeholder="Поиск тематики..." autocomplete="off" data-i18n-placeholder="placeholder_search_theme">
                        </div>
                    </div>
                    </div>
            </div>

            <div class="content-wrapper">
                <div id="themes-grid-wrapper">
                    <div id="themes-loading" class="loading-container hidden">
                        <div class="spinner"></div>
                        <span style="margin-left: 10px; color: var(--text-muted);" data-i18n="deep_link_loading">Загрузка...</span>
                    </div>
                    <div id="themes-grid" class="themes-page-grid-container"></div>
                </div>
            </div>
            </div>

            <!-- putya: "если выбрана логика, название выбирать нельзя и наоборот" — 🧠/🔤 взаимно
                 исключают друг друга при клике (см. theme-flags.js), 🎨 независим от обоих. -->
            <div id="tf-flags-panel" class="tf-flags-panel hidden">
                <div class="tf-flags-toolbar">
                    <input type="text" id="tf-search" class="tf-search-input" placeholder="Поиск тематики...">
                    <div class="tf-status-filters" id="tf-status-filters">
                        <button type="button" class="tf-status-btn active" data-status="">Все</button>
                        <button type="button" class="tf-status-btn" data-status="visual">🎨 Визуал</button>
                        <button type="button" class="tf-status-btn" data-status="logical">🧠 Логика</button>
                        <button type="button" class="tf-status-btn" data-status="visual+name">🎨🔤 Визуал+имя</button>
                        <button type="button" class="tf-status-btn" data-status="name">🔤 Имя</button>
                    </div>
                    <button type="button" id="tf-reload-btn" class="tf-reload-btn" title="Обновить список тем">⟳ Обновить</button>
                </div>
                <div id="tf-theme-list" class="tf-theme-list"></div>
            </div>
        </div>
    </main>

    <script type="module" src="../Monohrome/themes-modal.js"></script>
    <script type="module" src="../Monohrome/themes-modal-nfts.js"></script>
    <script type="module" src="./themes.js"></script>
    <script src="./theme-flags.js?v=1"></script>
</body>

</html>
