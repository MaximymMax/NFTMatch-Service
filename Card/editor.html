<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Редактор карточки</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./editor.css?v=11">
</head>
<body>
<!-- Редактор карточки: карточка и перетаскивание перенесены из примера E:\TG Concept\web (WebGL-шейдер,
     3D-наклон, стикеры) в оформлении сайта. Страница подключается в card.html через iframe, чтобы её
     стили не пересекались со стилями сайта. -->
<div class="app" id="app">

  <section class="left">
    <div class="status" id="status"></div>
    <div class="stage" id="stage">
      <div class="scene" id="scene">
        <div class="card" id="card">
          <div class="edge e3"></div><div class="edge e2"></div><div class="edge e1"></div>
          <div class="face" id="face">
            <canvas id="gl"></canvas>
            <canvas id="pat" class="pat"></canvas>

            <div class="content" id="content">
              <div class="balance">
                <svg class="gem" viewBox="0 0 64 64" aria-hidden="true">
                  <defs>
                    <linearGradient id="gA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="var(--gem2, #bfeaff)"/></linearGradient>
                    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gem1, #e9f8ff)"/><stop offset="1" stop-color="var(--gem3, #7cc8f0)"/></linearGradient>
                  </defs>
                  <path d="M14 8h36l12 14-30 36L2 22z" fill="url(#gB)"/>
                  <path d="M14 8 24 22h16L50 8z" fill="url(#gA)" opacity=".95"/>
                  <path d="M2 22h22L32 58zM62 22H40L32 58z" fill="#fff" opacity=".28"/>
                  <path d="M24 22 32 58 40 22z" fill="#fff" opacity=".12"/>
                  <path class="sparkle" d="M47 6l1.6 4.2L53 12l-4.4 1.8L47 18l-1.6-4.2L41 12l4.4-1.8z" fill="#fff"/>
                </svg>
                <span class="amount">11</span><span class="unit">GRAM</span>
              </div>
              <div class="usd">$33.00</div>
              <div class="holder" id="holder">COLLECTOR</div>
              <div class="chip" id="chip" aria-label="QR">
                <svg viewBox="0 0 32 32"><g fill="none" stroke="#6f7478" stroke-width="2.6" stroke-linejoin="round"><rect x="5" y="5" width="8.4" height="8.4" rx="2"/><rect x="18.6" y="5" width="8.4" height="8.4" rx="2"/><rect x="5" y="18.6" width="8.4" height="8.4" rx="2"/></g><g fill="#6f7478"><rect x="19" y="19" width="3.4" height="3.4" rx=".7"/><rect x="24" y="19" width="3.4" height="3.4" rx=".7"/><rect x="19" y="24" width="3.4" height="3.4" rx=".7"/><rect x="24" y="24" width="3.4" height="3.4" rx=".7"/></g></svg>
              </div>
              <div class="engrave" id="engrave"><span></span><span></span></div>
            </div>

            <div class="stickers" id="stickers"></div>
            <div class="fx" id="fx"></div>
          </div>
        </div>
      </div>
      <div class="bin" id="bin" aria-hidden="true">
      <svg viewBox="0 0 48 48"><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><g class="lid"><path d="M8 13h32"/><path d="M19 13V9h10v4"/></g><path d="M12 17l2 24h20l2-24"/><path d="M20 23v12M28 23v12"/></g></svg><span>Убрать</span>
    </div>
    </div>

    <div class="bar">
      <button type="button" class="pill-btn" id="btnShare">Поделиться</button>
      <button type="button" class="pill-btn" id="btnFs">⛶ На весь экран</button>
      <button type="button" class="pill-btn" id="btnClear" disabled>Очистить</button>
    </div>

    <div class="trayBox" id="trayBox">
      <div class="trayHead" id="trayHead"><b id="trayTitle">Выбранные</b><span id="trayCount"></span><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
      <div class="grid tray" id="tray"></div>
      <div class="note" id="trayNote"></div>
    </div>
  </section>

  <section class="right page" id="page">
    <div class="filters" id="filters">
      <button type="button" class="active" data-tab="profile">Профиль</button>
      <button type="button" data-tab="collections">Коллекции</button>
      <button type="button" data-tab="models">Модели</button>
      <button type="button" data-tab="themes">Тематики</button>
    </div>
    <input type="search" id="q" class="search" placeholder="Найти подарок профиля…" autocomplete="off" spellcheck="false">
    <div class="crumbs" id="crumbs" hidden>
      <button type="button" class="pill-btn" id="btnBack">← Назад</button>
      <b id="crumbTitle"></b>
    </div>
    <div class="grid" id="grid"></div>
    <button type="button" class="pill-btn more" id="btnMore" hidden>Показать ещё</button>
    <div class="note" id="note"></div>
  </section>

  <button type="button" class="fs-exit" id="btnFsExit" aria-label="Выйти из полноэкранного режима">✕</button>
  <div class="menu" id="menu" hidden></div>
  <div class="drag-hint" id="dragHint">Перетащите подарок сюда</div>
  <div class="toast" id="toast" role="status"></div>
</div>
<meta name="theme-color" content="#16213a">
<script src="./editor.js?v=11"></script>
</body>
</html>
